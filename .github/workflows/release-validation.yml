name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sha-release-audit:
    name: Exact-SHA release audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run benchmark -- --full
      - run: npm run browser:smoke
      - name: Packed artifact smoke + hash
        env:
          AGENT_BLINDSPOT_PACKAGE_EVIDENCE: package-evidence.json
        run: npm run package:smoke
      - name: Record candidate SHA
        shell: bash
        run: |
          printf '{"sha":"%s","workflow":"release-validation"}\n' "$GITHUB_SHA" > candidate-sha.json
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            package-evidence.json
            candidate-sha.json
          if-no-files-found: error
