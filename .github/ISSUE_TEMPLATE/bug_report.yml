name: Bug report
description: Reproducible AgentBlindspot behavior that appears incorrect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not upload secrets, private source, or unredacted transcripts. Prefer a synthetic reproduction."
  - type: input
    id: version
    attributes: {label: AgentBlindspot version, placeholder: "0.1.0 or commit SHA"}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: OS and Node version}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Minimal redacted reproduction, description: "Include exact command and safe fixture if possible."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
